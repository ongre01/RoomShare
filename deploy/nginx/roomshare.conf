# http-context template. Replace both example names, including the map entries.
map $http_host $roomshare_http_host {
    default "";
    room.example.com room.example.com;
    "room.example.com:443" room.example.com;
    admin-room.example.com admin-room.example.com;
    "admin-room.example.com:443" admin-room.example.com;
}
limit_req_zone "$server_name:$binary_remote_addr" zone=roomshare_clients:1m rate=2r/s;
log_format roomshare_status '$status $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null;
    return 403;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    access_log off;
    error_log /dev/null;
    return 421;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name room.example.com;
    include /etc/nginx/snippets/roomshare-proxy.conf;
    location ~ ^/(admin|api/admin)(/|$) {
        default_type application/json;
        return 403 '{"code":"ADMIN_FORBIDDEN","message":"관리자 접근이 허용되지 않습니다"}';
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin-room.example.com;
    ssl_client_certificate /etc/roomshare/tls/admin-ca.pem;
    ssl_crl /etc/roomshare/tls/admin-ca.crl;
    ssl_verify_client on;
    ssl_verify_depth 2;
    include /etc/nginx/snippets/roomshare-proxy.conf;
    if ($ssl_client_verify != SUCCESS) { return 403; }
    proxy_set_header X-RoomShare-Admin-Verified $ssl_client_verify;
    include /etc/roomshare/admin-proxy-header.conf;
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
