# Included at server scope on BOTH known TLS hosts.
ssl_certificate /etc/roomshare/tls/server-chain.pem;
ssl_certificate_key /etc/roomshare/tls/server.key;
ssl_session_tickets off;
ssl_session_cache off;
if ($ssl_server_name != $server_name) { return 421; }
if ($roomshare_http_host != $server_name) { return 421; }

access_log /var/log/nginx/roomshare-access.log roomshare_status;
# Even standard nginx request errors can contain the raw URI/query.
error_log /dev/null;
client_max_body_size 16k;
client_body_buffer_size 16k;
client_body_timeout 10s;
send_timeout 30s;
limit_req zone=roomshare_clients burst=20 nodelay;
limit_req_status 429;
error_page 413 = @roomshare_size;
error_page 429 = @roomshare_rate;

# Allowlist rather than trying to enumerate every possible forwarding header.
proxy_pass_request_headers off;
proxy_set_header Host $server_name;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Origin $http_origin;
proxy_set_header X-CSRF-Token $http_x_csrf_token;
proxy_connect_timeout 3s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
proxy_next_upstream off;
proxy_buffering off;
proxy_cache off;
proxy_hide_header Cache-Control;
add_header Cache-Control no-store always;

location @roomshare_size {
    default_type application/json;
    return 413 '{"code":"REQUEST_TOO_LARGE","message":"요청 본문이 너무 큽니다"}';
}
location @roomshare_rate {
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header Retry-After 1 always;
    return 429 '{"code":"RATE_LIMITED","message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요"}';
}
